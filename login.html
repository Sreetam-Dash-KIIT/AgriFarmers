<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Login</title>

  <style>
    :root {
      --bg-color: #f4f7f4;
      --card-bg: #ffffff;
      --primary: #2d5a27;
      --primary-hover: #1e3e1a;
      --text-main: #1d211d;
      --text-muted: #667060;
      --border: #dce3dc;
      --icon-color: #4a6b40;
      --error-color: #d32f2f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .top-controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .language-select {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.82rem;
      cursor: pointer;
      outline: none;
    }

    .language-select:focus {
      border-color: var(--primary);
    }

    .brand {
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 110px;
      height: 110px;
      margin-bottom: 12px;
      object-fit: cover;
      border-radius: 50%;
    }

    .brand h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 0.95rem;
      font-style: italic;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .sub-title {
      font-size: 0.88rem;
      color: #8a9485;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg.left-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: var(--icon-color);
      pointer-events: none;
    }

    .input-wrapper svg.right-icon {
      position: absolute;
      right: 14px;
      width: 18px;
      height: 18px;
      fill: var(--icon-color);
      cursor: pointer;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 42px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .register-link {
      margin-top: 18px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .register-link a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="login-container">

    <div class="top-controls">
      <select
        id="languageSelect"
        class="language-select"
        aria-label="Select language"
      >
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="or">ଓଡ଼ିଆ</option>
        <option value="mr">मराठी</option>
        <option value="bn">বাংলা</option>
        <option value="ta">தமிழ்</option>
        <option value="te">తెలుగు</option>
        <option value="bho">भोजपुरी</option>
        <option value="as">অসমীয়া</option>
      </select>
    </div>

    <header class="brand">

      <img
        src="/logo.png.jpeg"
        alt="AgriConnect Logo"
        class="brand-logo"
      >

      <h1>AgriConnect</h1>

      <p
        class="tagline"
        data-en="From harvest to home"
        data-hi="खेत से घर तक"
      >
        From harvest to home
      </p>

      <p
        class="sub-title"
        data-en="Sign in to your account"
        data-hi="अपने खाते में लॉग इन करें"
      >
        Sign in to your account
      </p>

    </header>

    <form id="loginForm">

      <div class="form-group">

        <div class="input-wrapper">

          <svg
            class="left-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            data-placeholder-en="Enter your email"
            data-placeholder-hi="अपना ईमेल दर्ज करें"
            required
            autocomplete="username"
          >

        </div>

      </div>

      <div class="form-group">

        <div class="input-wrapper">

          <svg
            class="left-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M17 8h-1V6c0-2.21-1.79-4-4-4S8 3.79 8 6v2H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-5 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm2-9H10V6c0-1.1.9-2 2-2s2 .9 2 2v2z"/>
          </svg>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            data-placeholder-en="Enter your password"
            data-placeholder-hi="अपना पासवर्ड दर्ज करें"
            required
            autocomplete="current-password"
          >

          <svg
            class="right-icon toggle-password"
            data-target="password"
            viewBox="0 0 24 24"
            role="button"
            tabindex="0"
            aria-label="Show password"
          >
            <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
          </svg>

        </div>

      </div>

      <button
        type="submit"
        class="btn-login"
        id="loginButton"
        data-en="Log In"
        data-hi="लॉग इन"
      >
        Log In
      </button>

    </form>

    <p class="register-link">

      <span
        data-en="Don't have an account?"
        data-hi="क्या आपका खाता नहीं है?"
      >
        Don't have an account?
      </span>

      <a
        href="/createaccount.html"
        data-en="Create Account"
        data-hi="खाता बनाएं"
      >
        Create Account
      </a>

    </p>

  </main>

  <script>

    const loginForm =
      document.getElementById('loginForm');

    const emailInput =
      document.getElementById('email');

    const passwordInput =
      document.getElementById('password');

    const languageSelect =
      document.getElementById('languageSelect');

    const loginButton =
      document.getElementById('loginButton');


    function setLanguage(language) {

      document
        .querySelectorAll('[data-en][data-hi]')
        .forEach(element => {

          element.textContent =
            element.getAttribute(
              `data-${language}`
            );

        });

      document
        .querySelectorAll(
          '[data-placeholder-en][data-placeholder-hi]'
        )
        .forEach(input => {

          input.placeholder =
            input.getAttribute(
              `data-placeholder-${language}`
            );

        });

      document.documentElement.lang =
        language === 'hi'
          ? 'hi'
          : 'en';

      localStorage.setItem(
        'agriconnect_language',
        language
      );

    }


    const savedLanguage =
      localStorage.getItem(
        'agriconnect_language'
      ) || 'en';


    languageSelect.value =
      savedLanguage;


    setLanguage(
      savedLanguage
    );


    languageSelect.addEventListener(
      'change',
      function () {

        setLanguage(
          this.value
        );

      }
    );


    document
      .querySelectorAll('.toggle-password')
      .forEach(icon => {

        const togglePassword = () => {

          const targetId =
            icon.getAttribute(
              'data-target'
            );

          const inputField =
            document.getElementById(
              targetId
            );

          const showing =
            inputField.type === 'text';

          inputField.type =
            showing
              ? 'password'
              : 'text';

          icon.setAttribute(
            'aria-label',
            showing
              ? 'Show password'
              : 'Hide password'
          );

        };


        icon.addEventListener(
          'click',
          togglePassword
        );


        icon.addEventListener(
          'keydown',
          function(event) {

            if (
              event.key === 'Enter' ||
              event.key === ' '
            ) {

              event.preventDefault();

              togglePassword();

            }

          }
        );

      });


    loginForm.addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {
          return;
        }


        loginButton.disabled =
          true;


        loginButton.textContent =
          agriAuthTranslate("Logging in...");


        try {

          const response =
            await fetch(
              '/login',
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body: JSON.stringify({
                  email: email,
                  password: password
                })

              }
            );


          let data = {};

          try {

            data =
              await response.json();

          } catch (jsonError) {

            data = {};

          }


          if (!response.ok) {

            alert(
              data.error ||
              (
                agriAuthTranslate("Invalid email or password.")
              )
            );

            return;

          }


          if (
            !data.user ||
            !data.user.role
          ) {

            alert(
              agriAuthTranslate("Invalid login response from server.")
            );

            return;

          }


          localStorage.setItem(
            'agriconnect_user',
            JSON.stringify(
              data.user
            )
          );


          alert(
            agriAuthTranslate("Login successful!")
          );


          if (
            data.user.role === 'farmer'
          ) {

            window.location.href =
              '/farmerdashboard.html';

          } else if (
            data.user.role === 'buyer'
          ) {

            window.location.href =
              '/consumerdashboard.html';

          } else if (
            data.user.role === 'driver'
          ) {

            window.location.href =
              '/driverdashboard.html';

          } else {

            localStorage.removeItem(
              'agriconnect_user'
            );

            alert(
              agriAuthTranslate("Unknown user role.")
            );

          }

        } catch (error) {

          console.error(
            'Login error:',
            error
          );


          alert(
            agriAuthTranslate("Could not connect to the AgriConnect server.")
          );

        } finally {

          loginButton.disabled =
            false;

          loginButton.textContent =
            agriAuthTranslate("Log In");

        }

      }
    );

  </script>

  function currentLang() {
    return LANGS.includes(localStorage.getItem("agriconnect_language"))
      ? localStorage.getItem("agriconnect_language")
      : "en";
  }

  function t(text) {
    return (translations[currentLang()] && translations[currentLang()][text]) || text;
  }

  function applyLanguage(lang) {
    if (!LANGS.includes(lang)) lang = "en";
    localStorage.setItem("agriconnect_language", lang);
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-en]").forEach(el => {
      const value = el.getAttribute("data-" + lang) || el.getAttribute("data-en");
      if (value !== null) el.textContent = value;
    });

    const select = document.getElementById("languageSelect");
    if (select) select.value = lang;

    // Translate native labels/options that use data attributes.
    document.querySelectorAll("[data-placeholder-en]").forEach(el => {
      el.placeholder = el.getAttribute("data-placeholder-" + lang) || el.getAttribute("data-placeholder-en");
    });
  }

  const select = document.getElementById("languageSelect");
  if (select) {
    select.addEventListener("change", () => applyLanguage(select.value));
    applyLanguage(currentLang());
  }

  window.agriAuthTranslate = t;
  window.agriAuthApplyLanguage = applyLanguage;
})();
</script>
