<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriFarmers - Login</title>
  <style>
    :root {
      --bg-color: #f4f7f4;
      --card-bg: #ffffff;
      --primary: #2d5a27;
      --primary-hover: #1e3e1a;
      --text-main: #1d211d;
      --text-muted: #667060;
      --border: #dce3dc;
      --icon-color: #4a6b40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 40px 32px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .brand {
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 110px;
      height: 110px;
      margin-bottom: 12px;
      object-fit: cover;
      border-radius: 50%;
    }

    .brand h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 0.95rem;
      font-style: italic;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .sub-title {
      font-size: 0.88rem;
      color: #8a9485;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    /* Icon Input Wrapper */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg.left-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: var(--icon-color);
      pointer-events: none;
    }

    .input-wrapper svg.right-icon {
      position: absolute;
      right: 14px;
      width: 18px;
      height: 18px;
      fill: var(--icon-color);
      cursor: pointer;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 42px 12px 42px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.15);
    }

    .forgot-links {
      display: flex;
      justify-content: space-between;
      margin-top: -4px;
      margin-bottom: 24px;
    }

    .forgot-links button {
      background: none;
      border: none;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s ease;
      padding: 0;
    }

    .forgot-links button:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 380px;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      transform: translateY(-10px);
      transition: transform 0.25s ease;
      text-align: left;
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: var(--primary);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }

    .modal-body p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background-color: #f0f3f0;
    }

    .btn-modal-primary {
      background-color: var(--primary);
      border: none;
      color: #fff;
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-modal-primary:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <main class="login-container">
    <header class="brand">
      <img src="logo.png.jpeg" alt="AgriConnect Logo" class="brand-logo">
      <h1>AgriConnect</h1>
      <p class="tagline">"From Harvest to Home"</p>
      <p class="sub-title">Sign in to your account</p>
    </header>

    <form action="#" method="POST">
      <!-- User ID Input with User Icon -->
      <div class="form-group">
        <div class="input-wrapper">
          <svg class="left-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <input 
            type="text" 
            id="userId" 
            name="userId" 
            placeholder="Enter your user ID" 
            required 
            autocomplete="username"
          >
        </div>
      </div>

      <!-- Password Input with Lock Icon & Eye Toggle -->
      <div class="form-group">
        <div class="input-wrapper">
          <svg class="left-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
          >
          <svg class="right-icon toggle-password" data-target="password" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </div>
      </div>


      <button type="submit" class="btn-login">Log In</button>
    </form>
  </main>
  <script>
    // Password Eye Icon Toggle
    document.querySelectorAll('.toggle-password').forEach(icon => {
      icon.addEventListener('click', function () {
        const targetId = this.getAttribute('data-target');
        const inputField = document.getElementById(targetId);

        if (inputField.type === 'password') {
          inputField.type = 'text';
          this.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/>';
        } else {
          inputField.type = 'password';
          this.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
        }
      });
    });

    // Modal Control Functions
    const userIdModal = document.getElementById('userIdModal');
    const passwordModal = document.getElementById('passwordModal');

    // Open Modals
    document.getElementById('openForgotId').addEventListener('click', () => userIdModal.classList.add('active'));
    document.getElementById('openForgotPassword').addEventListener('click', () => passwordModal.classList.add('active'));

    // Close Modals via Close/Cancel buttons
    document.querySelectorAll('[data-close]').forEach(button => {
      button.addEventListener('click', () => {
        const modalId = button.getAttribute('data-close');
        document.getElementById(modalId).classList.remove('active');
      });
    });

    // Close Modal by clicking outside of modal-box
    window.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('active');
      }
    });
  </script>

</body>
</html>
