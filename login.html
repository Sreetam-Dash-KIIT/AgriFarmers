<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Login</title>

  <style>
    :root {
      --bg-color: #f4f7f4;
      --card-bg: #ffffff;
      --primary: #2d5a27;
      --primary-hover: #1e3e1a;
      --text-main: #1d211d;
      --text-muted: #667060;
      --border: #dce3dc;
      --icon-color: #4a6b40;
      --error-color: #d32f2f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .top-controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .language-select {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.82rem;
      cursor: pointer;
      outline: none;
    }

    .language-select:focus {
      border-color: var(--primary);
    }

    .brand {
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 110px;
      height: 110px;
      margin-bottom: 12px;
      object-fit: cover;
      border-radius: 50%;
    }

    .brand h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 0.95rem;
      font-style: italic;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .sub-title {
      font-size: 0.88rem;
      color: #8a9485;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg.left-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: var(--icon-color);
      pointer-events: none;
    }

    .input-wrapper svg.right-icon {
      position: absolute;
      right: 14px;
      width: 18px;
      height: 18px;
      fill: var(--icon-color);
      cursor: pointer;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 42px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }

    .register-link {
      margin-top: 18px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .register-link a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="login-container">

    <div class="top-controls">

      <select
        id="languageSelect"
        class="language-select"
        aria-label="Select language"
      >

        <option value="en">
          English
        </option>

        <option value="hi">
          हिन्दी
        </option>

      </select>

    </div>


    <header class="brand">

      <img
        src="/logo.png.jpeg"
        alt="AgriConnect Logo"
        class="brand-logo"
      >

      <h1>
        AgriConnect
      </h1>

      <p
        class="tagline"
        data-en="From harvest to home"
        data-hi="खेत से घर तक"
      >
        From harvest to home
      </p>

      <p
        class="sub-title"
        data-en="Sign in to your account"
        data-hi="अपने खाते में लॉग इन करें"
      >
        Sign in to your account
      </p>

    </header>


    <form id="loginForm">


      <!-- Email -->

      <div class="form-group">

        <div class="input-wrapper">

          <svg
            class="left-icon"
            viewBox="0 0 24 24"
          >
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            data-placeholder-en="Enter your email"
            data-placeholder-hi="अपना ईमेल दर्ज करें"
            required
            autocomplete="username"
          >

        </div>

      </div>


      <!-- Password -->

      <div class="form-group">

        <div class="input-wrapper">

          <svg
            class="left-icon"
            viewBox="0 0 24 24"
          >
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            data-placeholder-en="Enter your password"
            data-placeholder-hi="अपना पासवर्ड दर्ज करें"
            required
            autocomplete="current-password"
          >

          <svg
            class="right-icon toggle-password"
            data-target="password"
            viewBox="0 0 24 24"
          >

            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c0-2.76 2.24-5 5-5s5 2.24 5 5-2.24 5-5 5-5-2.24-5-5-2.24-5-5-5z"/>

          </svg>

        </div>

      </div>


      <button
        type="submit"
        class="btn-login"
        data-en="Log In"
        data-hi="लॉग इन"
      >
        Log In
      </button>

    </form>


    <p class="register-link">

      <span
        data-en="Don't have an account?"
        data-hi="क्या आपका खाता नहीं है?"
      >
        Don't have an account?
      </span>

      <a
        href="/createaccount.html"
        data-en="Create Account"
        data-hi="खाता बनाएं"
      >
        Create Account
      </a>

    </p>

  </main>


  <script>

    const loginForm =
      document.getElementById('loginForm');

    const emailInput =
      document.getElementById('email');

    const passwordInput =
      document.getElementById('password');

    const languageSelect =
      document.getElementById('languageSelect');


    function setLanguage(language) {

      document
        .querySelectorAll('[data-en][data-hi]')
        .forEach(element => {

          element.textContent =
            element.getAttribute(
              `data-${language}`
            );

        });


      document
        .querySelectorAll(
          '[data-placeholder-en][data-placeholder-hi]'
        )
        .forEach(input => {

          input.placeholder =
            input.getAttribute(
              `data-placeholder-${language}`
            );

        });


      document.documentElement.lang =
        language === 'hi'
          ? 'hi'
          : 'en';


      localStorage.setItem(
        'agriconnect_language',
        language
      );

    }


    const savedLanguage =
      localStorage.getItem(
        'agriconnect_language'
      ) || 'en';


    languageSelect.value =
      savedLanguage;


    setLanguage(
      savedLanguage
    );


    languageSelect.addEventListener(
      'change',
      function () {

        setLanguage(
          this.value
        );

      }
    );


    // Password visibility

    document
      .querySelectorAll('.toggle-password')
      .forEach(icon => {

        icon.addEventListener(
          'click',
          function () {

            const targetId =
              this.getAttribute(
                'data-target'
              );

            const inputField =
              document.getElementById(
                targetId
              );


            if (
              inputField.type === 'password'
            ) {

              inputField.type =
                'text';

            } else {

              inputField.type =
                'password';

            }

          }
        );

      });


    // Login

    loginForm.addEventListener(
      'submit',
      async function (event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        try {

          const response =
            await fetch(
              '/login',
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body: JSON.stringify({

                  email:
                    email,

                  password:
                    password

                })

              }
            );


          const data =
            await response.json();


          if (response.ok) {

            localStorage.setItem(
              'agriconnect_user',
              JSON.stringify(
                data.user
              )
            );


            alert(
              languageSelect.value === 'hi'
                ? 'लॉग इन सफल रहा!'
                : 'Login successful!'
            );


            if (
              data.user.role === 'farmer'
            ) {

              window.location.href =
                '/farmerdashboard.html';

            } else if (
              data.user.role === 'buyer'
            ) {

              window.location.href =
                '/consumerdashboard.html';

            } else {

              alert(
                languageSelect.value === 'hi'
                  ? 'अज्ञात उपयोगकर्ता भूमिका।'
                  : 'Unknown user role.'
              );

            }


          } else {

            alert(
              data.error ||
              (
                languageSelect.value === 'hi'
                  ? 'ईमेल या पासवर्ड गलत है।'
                  : 'Invalid email or password.'
              )
            );

          }


        } catch (error) {

          console.error(
            'Login error:',
            error
          );


          alert(
            languageSelect.value === 'hi'
              ? 'AgriConnect सर्वर से कनेक्ट नहीं हो सका।'
              : 'Could not connect to the AgriConnect server.'
          );

        }

      }
    );

  </script>

</body>
</html>
