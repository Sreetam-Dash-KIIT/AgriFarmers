<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Driver Dashboard</title>
  <style>
    :root {
      --bg-color: #f8faf8;
      --card-bg: #ffffff;
      --primary: #2d5a27;
      --primary-hover: #1e3e1a;
      --accent: #e8f0e6;
      --text-main: #1d211d;
      --text-muted: #667060;
      --border: #e2e8e2;
      --danger: #d9381e;
      --danger-hover: #b82d16;
      --badge-bg: #e1f5fe;
      --badge-text: #0288d1;
      --warning-bg: #fff8e1;
      --warning-text: #8a5a00;
      --success-bg: #e8f5e9;
      --success-text: #2e7d32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding-bottom: 40px; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
    .nav-container { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
    .brand-logo-group { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .brand-logo-group img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .brand-name { font-size: 1.15rem; font-weight: 700; color: var(--primary); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .welcome-text { font-weight: 700; color: var(--primary); font-size: 0.95rem; }
    .lang-dropdown { padding: 4px 6px; border: 1px solid var(--border); border-radius: 12px; font-size: 0.82rem; font-weight: 600; background: var(--bg-color); color: var(--text-main); outline: none; cursor: pointer; width: 125px; text-overflow: ellipsis; }
    .btn-logout-header { background: transparent; color: var(--danger); border: 1px solid var(--danger); text-decoration: none; font-weight: 600; font-size: 0.85rem; padding: 5px 14px; border-radius: 20px; transition: all 0.2s ease; cursor: pointer; }
    .btn-logout-header:hover { background: rgba(217,56,30,0.08); border-color: var(--danger-hover); color: var(--danger-hover); }
    .dashboard-container { max-width: 1100px; margin: 20px auto 0; padding: 0 16px; display: flex; flex-direction: column; gap: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; text-align: center; }
    .stat-card h3 { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 2px; }
    .stat-card .stat-value { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
    .dashboard-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .section-header { font-size: 1.1rem; color: var(--primary); margin-bottom: 14px; border-bottom: 2px solid var(--accent); padding-bottom: 6px; font-weight: 700; }
    .vehicle-display-card { background: var(--accent); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .vehicle-info-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
    .vehicle-info-label { font-weight: 600; color: var(--text-muted); }
    .vehicle-info-val { font-weight: 700; color: var(--primary); }
    .product-list { display: flex; flex-direction: column; gap: 12px; }
    .empty-state { font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 16px 0; font-style: italic; }
    .product-item { background: var(--bg-color); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .product-info h4 { font-size: 0.95rem; color: var(--primary); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .product-details { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }
    .contact-info { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); font-size: 0.8rem; color: var(--text-main); display: flex; flex-direction: column; gap: 2px; }
    .contact-info a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .btn-action { width: 100%; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; }
    .btn-accept { background: var(--primary); color: #ffffff; }
    .btn-complete { background: #2e7d32; color: #ffffff; }
    .status-badge { padding: 2px 8px; border-radius: 12px; background: var(--badge-bg); color: var(--badge-text); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
    .filter-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .filter-input, .filter-select { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 7px; background: #fff; color: var(--text-main); outline: none; font-size: 0.84rem; }
    .filter-input:focus, .filter-select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(45,90,39,0.08); }
    .match-banner { background: var(--accent); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; margin-bottom: 12px; font-size: 0.82rem; color: var(--primary); font-weight: 600; display: none; }
    .load-meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; margin-top: 8px; }
    .load-meta span { font-size: 0.78rem; color: var(--text-muted); }
    .load-meta strong { color: var(--text-main); }
    .capacity-warning { background: var(--warning-bg); color: var(--warning-text); border: 1px solid #f0d98a; border-radius: 7px; padding: 7px 9px; font-size: 0.77rem; font-weight: 600; }
    .capacity-good { background: var(--success-bg); color: var(--success-text); border: 1px solid #b7dcb9; border-radius: 7px; padding: 7px 9px; font-size: 0.77rem; font-weight: 600; }
    .route-card { background: #fff; border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; }
    .route-line { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 600; }
    .route-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: 0 0 auto; }
    .route-arrow { color: var(--text-muted); }
    .active-progress { height: 8px; background: #e7ece7; border-radius: 999px; overflow: hidden; margin-top: 7px; }
    .active-progress-fill { height: 100%; width: 55%; background: var(--primary); border-radius: 999px; }
    .small-note { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
    .refresh-btn { border: 1px solid var(--border); background: #fff; color: var(--primary); border-radius: 7px; padding: 6px 10px; font-weight: 700; cursor: pointer; font-size: 0.76rem; }
    .section-title-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
    .section-title-row .section-header { margin-bottom: 0; flex: 1; }
    @media (max-width: 700px) {
      .header-right { gap: 6px; }
      .welcome-text { display: none; }
      .stats-grid { grid-template-columns: 1fr; }
      .filter-row { grid-template-columns: 1fr; }
      .load-meta { grid-template-columns: 1fr; }
      .vehicle-info-row { gap: 12px; }
      .vehicle-info-val { text-align: right; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-logo-group">
        <img src="logo.png.jpeg" alt="AgriConnect Logo">
        <span class="brand-name">AgriConnect</span>
      </a>
      <div class="header-right">
        <span class="welcome-text" id="header-welcome">Welcome!</span>
        <select id="lang-select" class="lang-dropdown" onchange="changeLanguage(this.value)">
          <option value="en">English</option>
          <option value="hi">हिंदी (Hindi)</option>
          <option value="mr">मराठी (Marathi)</option>
          <option value="or">ଓଡ଼ିଆ (Odia)</option>
          <option value="bn">বাংলা (Bengali)</option>
          <option value="bho">भोजपुरी (Bhojpuri)</option>
          <option value="ta">தமிழ் (Tamil)</option>
          <option value="te">తెలుగు (Telugu)</option>
          <option value="as">অসমীয়া (Assamese)</option>
        </select>
        <button class="btn-logout-header" id="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <div class="dashboard-container">
    <section class="stats-grid">
      <div class="stat-card">
        <h3 id="stat-lbl-loads">Available loads</h3>
        <div class="stat-value" id="stat-loads">0</div>
      </div>
      <div class="stat-card">
        <h3 id="stat-lbl-active">Active pickups</h3>
        <div class="stat-value" id="stat-active">0</div>
      </div>
      <div class="stat-card">
        <h3 id="stat-lbl-completed">Completed deliveries</h3>
        <div class="stat-value" id="stat-completed">0</div>
      </div>
    </section>

    <section class="dashboard-card">
      <h2 class="section-header" id="heading-vehicle">Registered Vehicle Profile</h2>
      <div class="vehicle-display-card">
        <div class="vehicle-info-row"><span class="vehicle-info-label" id="lbl-v-type">Vehicle Type:</span><span class="vehicle-info-val" id="driver-v-type">--</span></div>
        <div class="vehicle-info-row"><span class="vehicle-info-label" id="lbl-v-number">Registration Number:</span><span class="vehicle-info-val" id="driver-v-number">--</span></div>
        <div class="vehicle-info-row"><span class="vehicle-info-label" id="lbl-v-capacity">Max Capacity:</span><span class="vehicle-info-val" id="driver-v-capacity">--</span></div>
      </div>
    </section>

    <section class="dashboard-card">
      <div class="section-title-row">
        <h2 class="section-header" id="heading-requests">Available Freight Requests</h2>
        <button class="refresh-btn" onclick="loadDashboardData()" id="refresh-btn">Refresh</button>
      </div>
      <div class="filter-row">
        <input class="filter-input" id="filter-location" placeholder="Filter by pickup/location">
        <input class="filter-input" id="filter-crop" placeholder="Filter by crop">
        <select class="filter-select" id="filter-capacity">
          <option value="all">All loads</option>
          <option value="fit">Fits my vehicle</option>
        </select>
      </div>
      <div class="match-banner" id="match-banner"></div>
      <div class="product-list" id="available-list">
        <p class="empty-state" id="empty-available">No available freight requests at the moment.</p>
      </div>
    </section>

    <section class="dashboard-card">
      <div class="section-title-row">
        <h2 class="section-header" id="heading-active">Active In-Transit</h2>
        <button class="refresh-btn" onclick="loadDashboardData()" id="refresh-active-btn">Refresh</button>
      </div>
      <div class="product-list" id="active-list">
        <p class="empty-state" id="empty-active">No active shipments in transit.</p>
      </div>
    </section>
  </div>

    function getStoredUser() {
      try {
        const raw = localStorage.getItem('agriconnect_user');
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }

    async function ensureDriverSession() {
      const res = await fetch('/me', { credentials: 'include' });
      if (!res.ok) throw new Error('session');
      const data = await res.json();
      if (!data || data.role !== 'driver') throw new Error('driver');
      driverUser = data;
      localStorage.setItem('agriconnect_user', JSON.stringify(driverUser));
      return driverUser;
    }

    async function loadVehicle() {
      if (!driverUser) return;
      const res = await fetch(`/vehicles/${encodeURIComponent(driverUser.id)}`, { credentials: 'include' });
      if (!res.ok) return;
      const data = await res.json();
      driverVehicle = data;
      if (!driverVehicle) return;
      document.getElementById('driver-v-type').innerText = driverVehicle.vehicle_type || driverVehicle.type || '--';
      document.getElementById('driver-v-number').innerText = driverVehicle.registration_number || driverVehicle.vehicle_number || '--';
      document.getElementById('driver-v-capacity').innerText = driverVehicle.capacity != null ? `${driverVehicle.capacity} kg` : '--';
    }

    function normalizeProduct(p) {
      const quantity = Number(p.quantity ?? p.quantity_kg ?? p.amount ?? 0);
      const farmerName = p.farmer_name || p.farmer || p.seller_name || 'Farmer';
      return {
        id: p.id,
        crop: p.crop || p.crop_name || 'Crop',
        quantity,
        price: p.price ?? p.price_per_kg ?? '',
        location: p.location || p.farm_location || p.pickup_location || 'Location not specified',
        destination: p.destination || p.delivery_location || p.buyer_location || p.to_location || 'Destination not specified',
        farmer: farmerName,
        phone: p.phone || p.farmer_phone || p.contact || '',
        status: p.status || 'available'
      };
    }

    async function loadDashboardData() {
      try {
        const res = await fetch('/search', { credentials: 'include', cache: 'no-store' });
        if (!res.ok) throw new Error('products');
        const data = await res.json();
        const products = Array.isArray(data) ? data : (data.products || []);
        allLoads = products.map(normalizeProduct).filter(p => !['completed', 'delivered'].includes(String(p.status).toLowerCase()));
        renderAvailable();
        renderActive();
        updateStats();
      } catch (err) {
        document.getElementById('available-list').innerHTML = '<p class="empty-state">Unable to load freight requests.</p>';
        document.getElementById('active-list').innerHTML = '<p class="empty-state">Unable to load active shipments.</p>';
      }
    }

    function loadLocalJobs() {
      try {
        activeJobs = JSON.parse(localStorage.getItem(`agriconnect_driver_active_${driverUser.id}`) || '[]');
        if (!Array.isArray(activeJobs)) activeJobs = [];
      } catch { activeJobs = []; }
    }

    function saveLocalJobs() {
      if (driverUser) localStorage.setItem(`agriconnect_driver_active_${driverUser.id}`, JSON.stringify(activeJobs));
      localStorage.setItem('agriconnect_completed_jobs', String(completedJobs));
    }

    function getCapacity() {
      if (!driverVehicle) return 0;
      return Number(driverVehicle.capacity || driverVehicle.max_capacity || 0);
    }

    function renderAvailable() {
      const list = document.getElementById('available-list');
      const loc = document.getElementById('filter-location').value.trim().toLowerCase();
      const crop = document.getElementById('filter-crop').value.trim().toLowerCase();
      const fitOnly = document.getElementById('filter-capacity').value === 'fit';
      const activeIds = new Set(activeJobs.map(j => String(j.id)));

      const filtered = allLoads.filter(load => {
        if (activeIds.has(String(load.id))) return false;
        if (loc && !`${load.location} ${load.destination}`.toLowerCase().includes(loc)) return false;
        if (crop && !load.crop.toLowerCase().includes(crop)) return false;
        if (fitOnly && getCapacity() > 0 && load.quantity > getCapacity()) return false;
        return true;
      });

      list.innerHTML = '';
      const t = translations[currentLang] || translations.en;

      if (!filtered.length) {
        list.innerHTML = `<p class="empty-state">${t.noMatches}</p>`;
        return;
      }

      filtered.forEach(load => {
        const fits = getCapacity() <= 0 || load.quantity <= getCapacity();
        const item = document.createElement('div');
        item.className = 'product-item';
        item.dataset.id = load.id;
        item.innerHTML = `
          <div class="product-info">
            <h4><span class="item-title">${escapeHtml(load.crop)}</span><span class="status-badge">${t.badgeSuitable}</span></h4>
            <div class="load-meta">
              <span>${t.quantity}: <strong>${formatNumber(load.quantity)} kg</strong></span>
              <span>${t.farmer}: <strong>${escapeHtml(load.farmer)}</strong></span>
              <span>${t.pickup}: <strong>${escapeHtml(load.location)}</strong></span>
              <span>${t.destination}: <strong>${escapeHtml(load.destination)}</strong></span>
            </div>
            ${load.phone ? `<div class="contact-info"><span>${t.phone}: <a href="tel:${escapeHtml(load.phone)}">${escapeHtml(load.phone)}</a></span></div>` : ''}
          </div>
          <div class="${fits ? 'capacity-good' : 'capacity-warning'}">${fits ? t.capacityGood : t.capacityBad}</div>
          <button class="btn-action btn-accept" onclick="acceptJobById('${String(load.id).replace(/'/g, "\\'")}')">${t.btnAccept}</button>
        `;
        list.appendChild(item);
      });

      const banner = document.getElementById('match-banner');
      banner.style.display = filtered.length ? 'block' : 'none';
      banner.innerText = `${filtered.length} ${t.headingRequests.toLowerCase()}`;
    }

    function renderActive() {
      const list = document.getElementById('active-list');
      list.innerHTML = '';
      const t = translations[currentLang] || translations.en;

      if (!activeJobs.length) {
        list.innerHTML = `<p class="empty-state">${t.emptyActive}</p>`;
        return;
      }

      activeJobs.forEach(job => {
        const item = document.createElement('div');
        item.className = 'product-item';
        item.innerHTML = `
          <div class="product-info">
            <h4><span>${escapeHtml(job.crop)}</span><span class="status-badge" style="background:#fff3cd;color:#856404">${t.badgeInTransit}</span></h4>
            <div class="load-meta">
              <span>${t.quantity}: <strong>${formatNumber(job.quantity)} kg</strong></span>
              <span>${t.farmer}: <strong>${escapeHtml(job.farmer)}</strong></span>
              <span>${t.pickup}: <strong>${escapeHtml(job.location)}</strong></span>
              <span>${t.destination}: <strong>${escapeHtml(job.destination)}</strong></span>
            </div>
            ${job.phone ? `<div class="contact-info"><span>${t.phone}: <a href="tel:${escapeHtml(job.phone)}">${escapeHtml(job.phone)}</a></span></div>` : ''}
          </div>
          <div class="route-card">
            <div class="route-line"><span class="route-dot"></span><span>${escapeHtml(job.location)}</span><span class="route-arrow">→</span><span>${escapeHtml(job.destination)}</span></div>
            <div class="small-note">${t.progress}</div>
            <div class="active-progress"><div class="active-progress-fill"></div></div>
          </div>
          <button class="btn-action btn-complete" onclick="completeJobById('${String(job.id).replace(/'/g, "\\'")}')">${t.btnComplete}</button>
        `;
        list.appendChild(item);
      });
    }

    function acceptJobById(id) {
      const load = allLoads.find(x => String(x.id) === String(id));
      if (!load) return;
      if (activeJobs.some(x => String(x.id) === String(id))) return;

      activeJobs.push({ ...load, acceptedAt: new Date().toISOString() });
      saveLocalJobs();
      renderAvailable();
      renderActive();
      updateStats();
    }

    function completeJobById(id) {
      activeJobs = activeJobs.filter(x => String(x.id) !== String(id));
      completedJobs += 1;
      saveLocalJobs();
      renderAvailable();
      renderActive();
      updateStats();
      const t = translations[currentLang] || translations.en;
      alert(t.completedAlert);
    }

    function updateStats() {
      const activeIds = new Set(activeJobs.map(j => String(j.id)));
      document.getElementById('stat-loads').innerText = allLoads.filter(x => !activeIds.has(String(x.id))).length;
      document.getElementById('stat-active').innerText = activeJobs.length;
      document.getElementById('stat-completed').innerText = completedJobs;
    }

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('agriconnect_driver_lang', lang);
      const t = translations[lang] || translations.en;
      document.getElementById('header-welcome').innerText = t.welcome;
      document.getElementById('btn-logout').innerText = t.logout;
      document.getElementById('heading-vehicle').innerText = t.headingVehicle;
      document.getElementById('lbl-v-type').innerText = t.lblVType + ":";
      document.getElementById('lbl-v-number').innerText = t.lblVNumber + ":";
      document.getElementById('lbl-v-capacity').innerText = t.lblVCapacity + ":";
      document.getElementById('stat-lbl-loads').innerText = t.statLoads;
      document.getElementById('stat-lbl-active').innerText = t.statActive;
      document.getElementById('stat-lbl-completed').innerText = t.statCompleted;
      document.getElementById('heading-requests').innerText = t.headingRequests;
      document.getElementById('heading-active').innerText = t.headingActive;
      document.getElementById('empty-available').innerText = t.emptyAvailable;
      document.getElementById('empty-active').innerText = t.emptyActive;
      document.getElementById('refresh-btn').innerText = t.refresh;
      document.getElementById('refresh-active-btn').innerText = t.refresh;
      document.getElementById('filter-location').placeholder = t.location;
      document.getElementById('filter-crop').placeholder = t.crop;
      document.getElementById('filter-capacity').options[0].text = t.allLoads;
      document.getElementById('filter-capacity').options[1].text = t.fitLoads;
      renderAvailable();
      renderActive();
      updateStats();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    }

    async function logout() {
      try {
        await fetch('/logout', { method: 'POST', credentials: 'include' });
      } catch {}
      localStorage.removeItem('agriconnect_user');
      window.location.href = 'login.html';
    }

    async function initDashboard() {
      try {
        const stored = getStoredUser();
        if (stored && stored.role && stored.role !== 'driver') throw new Error('driver');
        await ensureDriverSession();
        loadLocalJobs();
        const savedLang = localStorage.getItem('agriconnect_driver_lang');
        if (savedLang && translations[savedLang]) {
          currentLang = savedLang;
          document.getElementById('lang-select').value = savedLang;
        }
        changeLanguage(currentLang);
        await loadVehicle();
        await loadDashboardData();
      } catch (err) {
        const t = translations[currentLang] || translations.en;
        alert(t.loginRequired);
        window.location.href = 'login.html';
      }
    }

    document.getElementById('filter-location').addEventListener('input', renderAvailable);
    document.getElementById('filter-crop').addEventListener('input', renderAvailable);
    document.getElementById('filter-capacity').addEventListener('change', renderAvailable);
    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
